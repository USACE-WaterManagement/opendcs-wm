---
name: Release
on:
  workflow_call:
    inputs:
      branch:
       type: string
       required: true
      nightly:
        type: boolean
        required: true
    secrets:
      token:
       required: false
    outputs:
      apps_image:
        description: App image tag for downstream consumption
        value: ${{ jobs.release.outputs.apps_image }}
      lrgs_image:
        description: Lrgs image
        value: ${{ jobs.release.outputs.lrgs_image }}
      migration_image:
        description: Database Migration image
        value: ${{ jobs.release.outputs.migration_image }}
      webapi_image:
        description: Web API (REST + UI) Image
        value: ${{ jobs.release.outputs.webapi_image }}
  workflow_dispatch:
    inputs:
      branch:
        type: choice
        required: true
        description: Which Branch to make the build from
        options:
          - develop
      nightly:
        type: boolean
        required: true
        description: Is this part of a "nightly" workflow?
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
        packages: write
        contents: write
    outputs:
      webapi_image: ${{steps.build_image.outputs.webapi_image}}
      apps_image: ${{steps.build_image.outputs.apps_image}}
      lrgs_image: ${{steps.build_image.outputs.lrgs_image}}
      migration_image: ${{steps.build_image.outputs.migration_image}}
    steps:
      - name: checkout code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{inputs.branch}}
      - name: Set version
        if: inputs.nightly == true
        run: echo "VERSION=${{inputs.branch}}-nightly" >> $GITHUB_ENV
      - name: Set version
        if: inputs.nightly == false
        run: echo "VERSION=${{inputs.branch}}" >> $GITHUB_ENV
      - name: show version
        run: echo ${VERSION}
      - name: Set up JDK
        uses: actions/setup-java@v4.7.1
        with:
          java-version: 21
          distribution: temurin      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1
      - name: Build algorithms
        working-directory: algorithms
        run: ./gradlew build --info
      - name: Create GitHub Release
        id: create_release
        # Allow testing without creating a release
        if: github.event_name != 'pull_request' && (github.event.ref == 'refs/heads/main' || startsWith(github.event.ref, 'refs/tags'))
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: algorithms/**/build/libs/*.jar
          tag_name: ${{env.VERSION}}
          token: ${{ secrets.token != null && secrets.token || secrets.GITHUB_TOKEN }}
      - name: Log in to the Container registry
        id: login-ghcr
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token != null && secrets.token || secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token != null && secrets.token || secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=${{env.VERSION}}
            type=schedule,pattern=${{inputs.branch}}-{{date 'YYYY.MM.DD'}}
            type=schedule,pattern=${{inputs.branch}}-{{date 'YYYY.MM.DD-hhmmss'}}
      - name: Create and Push Docker images
        id: baked
        uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8
        with:
          source: .
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: lrgs,apps,web-api,migration
          push: true
      - name: Set output names
        id: build_image
        env:
          VERSION: ${{env.VERSION}}
        run: |
          echo "apps_image=ghcr.io/usace-watermanagement/opendcs-wm/openopendcs-apps:$VERSION" >> $GITHUB_OUTPUT
          echo "lrgs_image=ghcr.io/usace-watermanagement/opendcs-wm/opendcs-lrgs:$VERSION" >> $GITHUB_OUTPUT
          echo "migration_image=ghcr.io/usace-watermanagement/opendcs-wm/opendcs-migration:$VERSION" >> $GITHUB_OUTPUT
          echo "webapi_image=ghcr.io/usace-watermanagement/opendcs-wm/opendcs-api:$VERSION" >> $GITHUB_OUTPUT
      - name: Logout of GH registry
        if: ${{ always() }}
        run: |
          docker logout ${{ steps.login-ghcr.outputs.registry }}